<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts-local.css">
<style>
/* Vertical 1080×1920. Readable-first: Libre Franklin bold for every line meant to be read; NOPA green/cream/gold.
   Safe area for Reels/TikTok/Shorts: readable content between y 250 and 1536, and left of x 940 below y 960. */
:root{
  --green:#1C4F35; --green-dark:#143A28; --cream:#F5F0E8; --gold:#E3CF9E; --gold-deep:#C5A55A;
  --ink:#1C1C1A; --ink-2:#4A4A45; --muted:#6E6E73; --line:#C6C6C8; --card:#FFFFFF;
  --sans:'Libre Franklin', Helvetica, Arial, sans-serif; --mono:ui-monospace,'DejaVu Sans Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--green-dark)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--ink)}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.dark{background:var(--green-dark);color:var(--cream)}
.light{background:var(--cream);color:var(--ink)}
.abs{position:absolute}
.eb{position:absolute;left:90px;top:280px;font:700 26px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;display:flex;gap:18px;align-items:center}
.eb:before{content:"";width:48px;height:3px;background:currentColor}
.light .eb{color:var(--green)} .dark .eb{color:var(--gold)}
.hd{position:absolute;left:90px;top:330px;width:880px;font:700 88px/1.04 var(--sans);letter-spacing:-.025em}
.hd b{color:var(--green)} .dark .hd b{color:var(--gold)}
.sub{position:absolute;left:90px;width:810px;font:500 38px/1.35 var(--sans);color:var(--ink-2)}
.dark .sub{color:rgba(245,240,232,.86)}

/* hook */
.hk{position:absolute;left:90px;font:700 132px/1 var(--sans);letter-spacing:-.03em;color:var(--cream)}
.hk.gold{color:var(--gold)}
.ball{position:absolute;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F4F7A8,#D6E24A 55%,#AEBB2C)}
.ball:after{content:"";position:absolute;inset:12px;border-radius:50%;border:5px solid rgba(255,255,255,.85);clip-path:polygon(0 0,45% 0,45% 100%,0 100%);transform:rotate(25deg)}
.shadow{position:absolute;width:126px;height:20px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(6px)}
.floor{position:absolute;left:90px;width:810px;height:4px;background:rgba(245,240,232,.25)}

/* phone */
.phone{position:absolute;width:490px;background:#1E2420;padding:10px;border-radius:62px;box-shadow:0 50px 100px -40px rgba(8,22,14,.6)}
.screen{position:relative;overflow:hidden;border-radius:52px;aspect-ratio:780/1328;background:var(--cream)}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.tap{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:6px solid var(--gold-deep);background:rgba(197,165,90,.25)}

/* chips + stats */
.chips{position:absolute;left:90px;top:600px;width:810px;display:flex;flex-wrap:wrap;gap:18px}
.chip{font:700 40px/1 var(--sans);padding:22px 30px;background:var(--card);box-shadow:0 0 0 3px var(--green);color:var(--green)}
.stats{position:absolute;left:90px;top:860px;width:810px;background:var(--card);box-shadow:0 0 0 2px rgba(15,29,61,.16),0 30px 60px -30px rgba(15,29,61,.25);padding:40px 44px}
.stats .lbl{font:700 24px/1 var(--sans);letter-spacing:.2em;color:var(--muted)}
.stats .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:40px 20px;margin-top:36px}
.stats .v{font:700 96px/1 var(--sans);color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats .k{font:700 24px/1 var(--sans);letter-spacing:.18em;color:var(--muted);margin-top:12px}

/* code card */
.codecard{position:absolute;left:90px;width:810px;background:var(--card);box-shadow:0 0 0 2px rgba(15,29,61,.16),0 30px 60px -30px rgba(15,29,61,.25);padding:44px 44px 40px}
.codecard .lbl{font:700 24px/1 var(--sans);letter-spacing:.2em;color:var(--muted)}
.codebox{margin-top:26px;height:180px;display:flex;align-items:center;justify-content:center;gap:16px;background:#EDEAE4}
.codebox.input{background:var(--card);box-shadow:inset 0 0 0 3px var(--green)}
.codebox span{font:700 120px/1 var(--mono);color:var(--green);width:92px;text-align:center}
.codebox .ph{color:#B8B5AE;letter-spacing:.3em;font:700 64px/1 var(--mono);width:auto}
.caret{width:6px;height:110px;background:var(--green)}
.btn{margin-top:28px;height:100px;display:flex;align-items:center;justify-content:center;font:700 30px/1 var(--sans);letter-spacing:.18em;color:#fff;background:var(--green)}
.btn.off{background:#C7C7CC}
.toast{position:absolute;left:90px;background:var(--green-dark);color:var(--cream);font:700 32px/1.2 var(--sans);padding:26px 32px;display:flex;gap:16px;align-items:center}
.toast i{font-style:normal;color:var(--gold)}

/* players row */
.roster{position:absolute;left:90px;width:810px}
.roster .lbl{font:700 26px/1 var(--sans);letter-spacing:.18em;color:var(--muted);display:flex;justify-content:space-between}
.roster .lbl b{color:var(--green);font-variant-numeric:tabular-nums}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:28px}
.av{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 40px/1 var(--sans)}
.avn{text-align:center;font:600 28px/1 var(--sans);margin-top:12px}

/* form */
.stepper{position:absolute;left:90px;top:600px;width:810px;display:flex;align-items:center;gap:20px;font:700 32px/1 var(--sans)}
.stepper .dot{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#C7C7CC;font:700 28px/1 var(--sans);flex:none}
.stepper .dot.on{background:var(--green)}
.stepper .bar{flex:1;height:3px;background:#C7C7CC}
.stepper .t{color:var(--muted)} .stepper .t.on{color:var(--ink)}
.field{position:absolute;left:90px;width:810px;background:var(--card);box-shadow:0 0 0 2px rgba(15,29,61,.16);padding:36px 40px}
.field .q{font:700 50px/1.1 var(--sans);letter-spacing:-.015em}
.field .in{margin-top:28px;height:110px;box-shadow:inset 0 0 0 3px var(--line);display:flex;align-items:center;padding:0 30px;font:500 44px/1 var(--sans);color:var(--ink)}
.field .in.on{box-shadow:inset 0 0 0 3px var(--green)}
.field .in .c{width:4px;height:56px;background:var(--green);margin-left:4px}

/* court + leaderboard */
.court{position:absolute;left:90px;width:810px;background:var(--card);box-shadow:0 0 0 2px var(--line),0 30px 60px -30px rgba(15,29,61,.25)}
.court .h{background:var(--green);color:#fff;font:700 28px/1 var(--sans);letter-spacing:.14em;padding:22px 32px;display:flex;justify-content:space-between}
.court .h b{font:700 22px/1 var(--sans);padding:6px 12px;background:rgba(255,255,255,.18)}
.court .teams{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;padding:30px 28px 0;text-align:center}
.court .tl{font:700 22px/1 var(--sans);letter-spacing:.14em;color:var(--muted)}
.court .tn{font:700 40px/1.15 var(--sans);margin-top:10px}
.court .vs{font:700 26px/1 var(--sans);color:var(--muted)}
.court .sc{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:26px}
.court .box{width:140px;height:110px;box-shadow:inset 0 0 0 3px var(--line);background:var(--cream);display:flex;align-items:center;justify-content:center;font:700 64px/1 var(--sans);color:#9A9A9F}
.court .box.on{box-shadow:inset 0 0 0 3px var(--green);color:var(--ink)}
.court .dash{font:700 44px/1 var(--sans);color:var(--muted)}
.court .btn{margin:26px 28px 28px;height:90px}
.lb{position:absolute;left:90px;width:810px;background:var(--card);box-shadow:0 0 0 2px rgba(15,29,61,.16),0 30px 60px -30px rgba(15,29,61,.2)}
.lb .h{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;border-bottom:2px solid var(--line)}
.lb .h span{font:700 24px/1 var(--sans);letter-spacing:.18em;color:var(--muted)}
.lb .h b{font:700 24px/1 var(--sans);color:var(--green);font-variant-numeric:tabular-nums}
.lb .rows{position:relative;overflow:hidden}
.row{position:absolute;left:0;right:0;display:grid;grid-template-columns:56px 60px 1fr auto 100px;align-items:center;padding:0 28px;border-bottom:1px solid #E5E1DA;background:#fff;gap:6px}
.row .rk{font:600 30px/1 var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.row .a{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 18px/1 var(--sans)}
.row .nm{font:700 36px/1 var(--sans);padding-left:10px}
.row .you{font:700 18px/1 var(--sans);letter-spacing:.14em;color:#fff;background:var(--green);padding:8px 10px}
.row .pt{font:700 40px/1 var(--sans);color:var(--green);text-align:right;font-variant-numeric:tabular-nums}

/* sealed + podium */
.panel{position:absolute;left:90px;width:810px;background:var(--green);box-shadow:inset 0 0 0 2px rgba(245,240,232,.16);color:var(--cream);text-align:center}
.panel .by{font:600 24px/1 var(--sans);letter-spacing:.28em;color:rgba(245,240,232,.75);margin-top:52px}
.panel .tt{font:700 64px/1.05 var(--sans);letter-spacing:-.01em;margin-top:22px}
.panel .ss{font:500 34px/1.35 var(--sans);color:rgba(245,240,232,.86);margin:26px 70px 0}
.lock{width:120px;height:120px;margin:60px auto 0;border-radius:50%;box-shadow:inset 0 0 0 4px var(--gold);display:flex;align-items:center;justify-content:center}
.lock svg{width:56px;height:56px}
.pods{position:absolute;left:0;right:0;bottom:56px;height:560px}
.pod{position:absolute;bottom:0;width:230px;background:rgba(245,240,232,.10);box-shadow:inset 0 0 0 2px rgba(245,240,232,.2)}
.pod.first{background:rgba(245,240,232,.16);box-shadow:inset 0 0 0 3px rgba(227,207,158,.7)}
.pod .n{font:700 38px/1 var(--sans);margin-top:30px}
.pod .s{font:700 100px/1 var(--sans);margin-top:12px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pod .u{font:700 20px/1 var(--sans);letter-spacing:.2em;opacity:.8;margin-top:8px}
.pava{position:absolute;width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 36px/1 var(--sans);box-shadow:0 0 0 5px rgba(245,240,232,.5)}
.pnum{position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(245,240,232,.16);box-shadow:inset 0 0 0 2px rgba(245,240,232,.35);color:#fff;font:700 30px/1 var(--sans);display:flex;align-items:center;justify-content:center}
.congrats{position:absolute;left:90px;width:810px;text-align:center;color:var(--gold);font:700 44px/1.2 var(--sans)}
canvas.conf{position:absolute;inset:0}

/* outro */
.wm{position:absolute;left:50%;height:80px;transform:translateX(-50%)}
.ob{position:absolute;left:0;right:0;text-align:center;font:700 26px/1 var(--sans);letter-spacing:.26em;color:var(--gold)}
.ol{position:absolute;left:60px;right:60px;text-align:center;font:700 104px/1.04 var(--sans);letter-spacing:-.03em;color:var(--cream)}
.ol b{color:var(--gold)}
.os{position:absolute;left:90px;right:90px;text-align:center;font:500 40px/1.35 var(--sans);color:rgba(245,240,232,.86)}
.orule{position:absolute;left:50%;width:140px;height:3px;margin-left:-70px;background:rgba(245,240,232,.35)}
</style></head>
<body>
<div id="stage"></div>
<script>
const V = new URLSearchParams(location.search).get("v") || "host";
const stage = document.getElementById("stage");
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const prog = (t,a,d) => clamp((t-a)/d);
const outCubic = x => 1 - Math.pow(1-x,3);
const outQuint = x => 1 - Math.pow(1-x,5);
const inCubic = x => x*x*x;
const outBack = x => { const c1=1.4,c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const lerp = (a,b,x) => a + (b-a)*x;
function h(tag, cls, html, style){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; if(style) e.style.cssText=style; return e; }
function enter(el,t,at,{dy=50,dx=0,dur=.45,ease=outCubic}={}){ const p=ease(prog(t,at,dur)); el.style.opacity=p; el.style.transform=`translate(${(1-p)*dx}px,${(1-p)*dy}px)`; return p; }
const exitMul = (t,at,d=.25) => 1 - inCubic(prog(t,at,d));
const AV = {Bram:["#E9E4F5","#5B4A8B"],Daan:["#F7E6DE","#9A4A2E"],"Inès":["#E3F0E8","#1C4F35"],Jules:["#E4ECF5","#34557A"],Lotte:["#F8E3E3","#8A3B3B"],Mateo:["#F5EAD7","#8A6420"],Noor:["#E6E6F7","#47478F"],Sofia:["#F6E1DA","#8B3A22"]};
const ini = n => n.slice(0,2).toUpperCase();

/* ---------- reusable scene builders: each returns {el, draw(t)} ---------- */
function hookScene(lines, a, b){
  const el = h("section","scene dark");
  const ls = lines.map(([txt,at,top,gold]) => { const e=h("div","hk"+(gold?" gold":""),txt,`top:${top}px`); el.appendChild(e); return [e,at]; });
  const floor = h("div","floor","",`top:1408px`), sh=h("div","shadow"), ball=h("div","ball");
  el.append(floor, sh, ball);
  return { el, a, b, draw(t){
    const ex = exitMul(t, b-.28, .28);
    ls.forEach(([e,at]) => { enter(e,t,at,{dy:60,dur:.4}); e.style.opacity *= ex; });
    const fl = 1300, x0 = 640;
    let y, sq=1;
    if (t < 2.5){ const ph=(t%.5)/.5; y = fl - Math.sin(Math.PI*ph)*(360 - t*70); sq = (ph<.06||ph>.94)?.86:1; }
    else { y = fl - Math.abs(Math.sin(Math.PI*2*prog(t,2.5,.5)))*90*Math.max(0,1-(t-2.5)/1.2); }
    const dx = t>2.5 ? (t-2.5)*50 : 0;
    ball.style.left=(x0+dx)+"px"; ball.style.top=y+"px"; ball.style.transform=`scale(${1/sq*.98+.02},${sq})`; ball.style.opacity=ex;
    const hg=(fl-y)/360; sh.style.left=(x0-8+dx)+"px"; sh.style.top=(fl+100)+"px"; sh.style.opacity=(.55-hg*.35)*ex; sh.style.transform=`scale(${1-hg*.4})`;
    floor.style.opacity = ex;
  }};
}
function headed(el, eb, hd, a){
  const e1=h("div","eb",eb), e2=h("div","hd",hd); el.append(e1,e2);
  return t => { enter(e1,t,a+.05,{dx:-40,dy:0}); enter(e2,t,a+.1,{dy:50,dur:.5}); };
}
function outroScene(a,b,lines,sub){
  const el=h("section","scene dark");
  const wm=h("img","wm"); wm.src="img/nopa-wordmark-white.png"; wm.style.top="380px";
  const ob=h("div","ob","THE CLUBHOUSE","top:500px");
  const ls=lines.map(([txt,top]) => h("div","ol",txt,`top:${top}px`));
  const os=h("div","os",sub,"top:1170px"), rule=h("div","orule","","top:1320px");
  el.append(wm,ob,...ls,os,rule);
  return {el,a,b,draw(t){
    enter(wm,t,a+.05,{dy:-24}); wm.style.transform += " translateX(-50%)";
    enter(ob,t,a+.2,{dy:20});
    ls.forEach((l,i)=>enter(l,t,a+.5+i*.5,{dy:60}));
    enter(os,t,a+.5+ls.length*.5,{dy:24,dur:.5});
    rule.style.transform=`scaleX(${outCubic(prog(t,a+.6+ls.length*.5,.6))})`;
  }};
}
function leaderboard(top, rowH, stages, opts={}){
  const box=h("div","lb","",`top:${top}px`);
  const hdr=h("div","h",`<span>LEADERBOARD</span><b></b>`); const rows=h("div","rows","",`height:${rowH*8}px`);
  box.append(hdr,rows);
  const els={};
  Object.keys(AV).forEach(n=>{ const r=h("div","row",`<span class="rk"></span><span class="a" style="background:${AV[n][0]};color:${AV[n][1]}">${ini(n)}</span><span class="nm">${n}</span><span>${n===opts.you?'<span class="you">YOU</span>':''}</span><span class="pt"></span>`,`height:${rowH}px`); if(n===opts.you) r.style.background="#EEF4EF"; rows.appendChild(r); els[n]=r; });
  return { el:box, draw(t){
    let s=0; stages.forEach((st,i)=>{ if(t>=st.at) s=i; });
    const from=stages[Math.max(0,s-1)].rows, to=stages[s].rows;
    const mp = s===0 ? 1 : outCubic(prog(t,stages[s].at,.55));
    hdr.querySelector("b").textContent = stages[s].label;
    to.forEach(([n,pts],i)=>{
      const j=from.findIndex(x=>x[0]===n), prev=from[j][1], r=els[n];
      r.style.transform=`translateY(${lerp(j*rowH,i*rowH,mp)}px)`;
      r.style.zIndex = i<j?3:(i===j?2:1);
      r.querySelector(".rk").textContent=i+1;
      r.querySelector(".pt").textContent=Math.round(lerp(prev,pts,s===0?1:mp));
      const base = n===opts.you ? "#EEF4EF" : "#fff";
      const hl = (s>0 && pts!==prev && mp<1) ? .24*(1-mp) : 0;
      r.style.background = hl ? `linear-gradient(rgba(197,165,90,${hl}),rgba(197,165,90,${hl})),${base}` : base;
    });
  }};
}
function podiumPanel(top, height, at0, opts={}){
  const p=h("div","panel","",`top:${top}px;height:${height}px`);
  p.append(h("div","by","BY NOPA PADEL"), h("div","tt","Sunday Americano"));
  const pods=h("div","pods"); p.appendChild(pods);
  const P=[{n:"Inès",s:93,rank:2,x:40,h:270,at:at0+.5},{n:"Sofia",s:93,rank:1,x:290,h:330,at:at0+1.0,first:true},{n:"Bram",s:92,rank:3,x:540,h:230,at:at0}];
  const els=P.map(q=>{ const w=h("div","",`<div class="pava" style="left:63px;background:${AV[q.n][0]};color:${AV[q.n][1]};${q.first?'box-shadow:0 0 0 6px #C5A55A':''}">${ini(q.n)}</div><div class="pnum" style="left:85px">${q.rank}</div><div class="pod ${q.first?'first':''}" style="height:${q.h}px;left:0"><div class="n">${q.n}${opts.you===q.n?' <span style="font-size:20px;letter-spacing:.14em;background:#C5A55A;color:#143A28;padding:4px 8px;vertical-align:middle">YOU</span>':''}</div><div class="s" style="color:${q.first?'#E3CF9E':q.rank===3?'#D9A15A':'#DADADA'}">0</div><div class="u">PTS</div></div>`,`position:absolute;left:${q.x}px;bottom:0;width:230px;height:560px`); pods.appendChild(w); return w; });
  return { el:p, draw(t){
    P.forEach((q,i)=>{ const w=els[i], pp=outBack(prog(t,q.at,.45)), hh=q.h*clamp(pp,0,1.06), tp=560-hh;
      const pod=w.querySelector(".pod"), av=w.querySelector(".pava"), nu=w.querySelector(".pnum");
      pod.style.height=hh+"px"; pod.style.opacity=prog(t,q.at,.1);
      nu.style.top=(tp-78)+"px"; av.style.top=(tp-190)+"px";
      nu.style.opacity=av.style.opacity=prog(t,q.at+.1,.2);
      av.style.transform=`scale(${.6+.4*outBack(prog(t,q.at+.1,.35))})`;
      w.querySelector(".s").textContent=Math.round(q.s*outCubic(prog(t,q.at+.05,.6)));
    });
  }};
}
const CONF = Array.from({length:150},(_,i)=>{ const r=k=>{const x=Math.sin(i*12.9898+k*78.233)*43758.5453; return x-Math.floor(x);}; return {x0:495+(r(1)-.5)*560, vx:(r(2)-.5)*800, vy:-400-r(3)*500, rot:r(4)*6, vr:(r(5)-.5)*14, w:12+r(6)*12, h:7+r(7)*8, c:["#E3CF9E","#C5A55A","#F5F0E8","#2A6B49","#D8BC72"][Math.floor(r(8)*5)], d:r(9)*.25}; });
function confetti(cv, t, at, y0, mul=1){
  // a light shower from the top of the frame: it stays above the podium scores while the scene is on screen
  const c=cv.getContext("2d"); c.clearRect(0,0,1080,1920); const ct=t-at; if(ct<=0) return;
  CONF.forEach((p,i)=>{ const tt=ct-p.d*2; if(tt<=0) return;
    const x=(i*73.3)%1080 + Math.sin(tt*3+p.rot)*24, y=-40-p.w*6+ (260+Math.abs(p.vx)*.35)*tt;
    if(y>1960) return;
    c.save(); c.translate(x,y); c.rotate(p.rot+p.vr*tt*.5); c.globalAlpha=mul; c.fillStyle=p.c; c.fillRect(-p.w/2,-p.h/2,p.w,p.h); c.restore(); });
}
function codeCard(top, code, at, {input=false, label="JOIN CODE", hint="", button=null}={}){
  const card=h("div","codecard","",`top:${top}px`);
  card.appendChild(h("div","lbl",label));
  const box=h("div","codebox"+(input?" input":"")); card.appendChild(box);
  const ph=h("span","ph","ABC123"); if(input) box.appendChild(ph);
  const sp=code.split("").map(c=>{const s=h("span","",c); box.appendChild(s); return s;});
  const caret=h("div","caret"); box.appendChild(caret);
  let hintEl=null, btn=null;
  if(hint){ hintEl=h("div","",hint,"margin-top:24px;font:500 30px/1.4 var(--sans);color:var(--muted);text-align:center"); card.appendChild(hintEl); }
  if(button){ btn=h("div","btn off",button.text); card.appendChild(btn); }
  return { el:card, draw(t){
    let n=0; sp.forEach((s,i)=>{ const a=at+i*.25; const on=t>=a; if(on) n++; s.style.display=on?"block":"none"; const p=outBack(prog(t,a,.22)); s.style.transform=`translateY(${(1-p)*30}px) scale(${.7+.3*p})`; });
    ph.style.display = n===0 ? "block" : "none";
    caret.style.display = n<code.length ? "block" : "none"; caret.style.opacity = Math.floor(t*4)%2===0 ? 1 : .2;
    if(btn){ btn.classList.toggle("off", n<code.length); const pr = t>=button.at && t<button.at+.2 ? .965 : 1; btn.style.transform=`scale(${pr})`; }
  }};
}
function rosterRow(top, names, at, step=.25, label="PLAYERS", total=8){
  const r=h("div","roster","",`top:${top}px`);
  const lbl=h("div","lbl",`<span>${label}</span><b></b>`); r.appendChild(lbl);
  const grid=h("div","avs"); r.appendChild(grid);
  const cells=names.map(n=>{ const c=h("div","",`<div class="av" style="background:${AV[n][0]};color:${AV[n][1]}">${ini(n)}</div><div class="avn">${n}</div>`); grid.appendChild(c); return c; });
  return { el:r, draw(t){ let k=0; cells.forEach((c,i)=>{ const a=at+i*step; const p=outBack(prog(t,a,.3)); c.style.opacity=prog(t,a,.12); c.style.transform=`scale(${.5+.5*clamp(p,0,1.1)})`; if(t>=a) k++; }); lbl.querySelector("b").textContent=`${k} / ${total}`; }};
}
