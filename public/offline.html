<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C4F35">
<title>Offline — NOPA Clubhouse</title>
<style>
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #1C4F35; color: #F5F0E8; font-family: Helvetica, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .rule { height: 1px; background: rgba(245,240,232,.5); }
  small { display: block; margin: 26px 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: #D9D0C7; }
  h1 { font-family: "Bodoni Moda", Didot, "Bodoni 72", Georgia, serif; font-weight: 500; font-size: 2.4rem; line-height: 1.1; margin: 0 0 10px; }
  p { color: rgba(245,240,232,.8); font-size: 14px; line-height: 1.55; margin: 0 0 22px; }
  button { font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #1C4F35; background: #F5F0E8; border: 0; padding: 14px 28px; margin-bottom: 26px; }
</style>
</head>
<body>
  <div style="max-width:340px;width:100%">
    <div class="rule"></div>
    <small>No connection</small>
    <h1>Rain delay</h1>
    <p>Scores are kept on the server, so the Clubhouse needs a signal. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="rule"></div>
  </div>
</body>
</html>
